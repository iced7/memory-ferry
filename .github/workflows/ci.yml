name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - name: Stress background embedding lifecycle on Windows
        if: runner.os == 'Windows'
        run: npm run test:stress

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:exe:win
      - name: Verify standalone executable
        run: node scripts/smoke-windows-exe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: MemoryFerry-windows-x64
          path: release/
