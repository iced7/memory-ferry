name: Bug report / 错误报告
description: Report a reproducible Memory Ferry problem / 报告可复现问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include tokens, secrets, or private memory content. / 请勿提交 Token、机密或私人记忆内容。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: 0.6.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 操作系统
      options: [Windows 11, Windows 10, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际结果
    validations:
      required: true
